{{ define "main" }}
<article class="article">
  {{ with .File }}<p class="cmd"><span class="ps1" aria-hidden="true">$</span> cat posts/{{ .BaseFileName }}.md</p>{{ end }}
  <header class="article-header">
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ range (.GetTerms "categories") }}<a class="kind" data-kind="{{ .LinkTitle }}" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
      {{ range (.GetTerms "tags") }}<a class="tag" href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
    </div>
    <h1>{{ .Title }}</h1>
  </header>
  <div class="article-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
