# 本番の baseURL は GitHub Actions が Pages の設定から渡す（ローカルでは hugo server が上書きする）
baseURL = "https://blog.swallowarc.jp/"
locale = "ja"
defaultContentLanguage = "ja"
hasCJKLanguage = true
title = "swallowarc blog"
enableRobotsTXT = true
capitalizeListTitles = false

[params]
  description = "AI エージェント開発と、仕事で使う技術の新しい動きについてのメモ。"

[taxonomies]
  category = "categories"
  tag = "tags"

[pagination]
  pagerSize = 20

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = true
  style = "github"
